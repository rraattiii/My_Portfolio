name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find .csproj and Publish
        run: |
          echo "🔍 Searching for .csproj file..."
          PROJECT=$(find . -name "*.csproj" -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "❌ No .csproj file found!"
            ls -la
            find . -name "*.csproj" || echo "Nothing found"
            exit 1
          fi
          echo "✅ Found project: $PROJECT"
          dotnet publish "$PROJECT" -c Release -o build --nologo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4